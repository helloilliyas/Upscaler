name: vector_converter
description: Personal image-to-vector converter (Modal + FastAPI backend).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10
  dio: ^5.7.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_saver: ^0.2.14
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
