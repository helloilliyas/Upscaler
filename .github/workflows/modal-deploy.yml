name: Deploy Modal Backend

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "backend/**"
      - ".github/workflows/modal-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Modal and backend deps
        # modal deploy imports the backend code locally to build the deployment
        # graph, so the runtime deps (pydantic, Pillow, ...) must be present.
        run: |
          pip install modal
          pip install -r requirements.txt

      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_app.py
