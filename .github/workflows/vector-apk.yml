name: Build Vectorizer APK

# Builds the release APK for the vector-app Flutter project and publishes it
# as a workflow artifact (Actions run page -> Artifacts -> vectorizer-apk).

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "vector-app/**"
      - ".github/workflows/vector-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vector-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.5"
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vectorizer-apk
          path: vector-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish as release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Vectorizer.apk
          gh release delete vectorizer-latest --cleanup-tag --yes || true
          gh release create vectorizer-latest \
            --title "Vectorizer APK (latest)" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --target ${{ github.sha }} \
            Vectorizer.apk
